services:

  db:
    image: postgres:16

    volumes:
      - db_data:/var/lib/postgresql/data

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"


  web:
    build: .

    command: sh -c "python manage.py migrate && gunicorn ecommarce.wsgi:application --bind 0.0.0.0:8000"

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_started


  celery_worker:
    build: .

    command: celery -A ecommarce worker -l info

    volumes:
      - .:/app

    env_file:
      - .env

    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_started


volumes:
  db_data:

